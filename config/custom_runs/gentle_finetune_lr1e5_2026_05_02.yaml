# Gentle AR-first fine-tune from the current best Stage-1 checkpoint.
# This intentionally uses a tiny learning rate because the May 1 deep run
# showed that aggressive continuation training damages alignment metrics.

dataset:
  swd_path: data
  max_length_sec: 15.0
  segment_sampling: aligned_measures
  samples_per_epoch: 64
  cache_spectrograms: true
  cache_root: .cache/cqt
  debug_subset_lieder: [D911-07, D911-18, D911-20, D911-22, D911-24, D911-17, D911-06, D911-02]
  val_split: 0.2
  performances: null

audio:
  sr: 22050
  hop_length: 220
  n_bins: 84
  bins_per_octave: 12

model:
  embed_dim: 64
  conv_channels: [32, 64, 128, 128]
  gru_hidden_size: 128
  num_gru_layers: 2
  dropout: 0.1
  temporal_attention_heads: 0

training:
  epochs: 5
  batch_size: 4
  lr: 0.00001
  weight_decay: 0.0001
  gradient_clip: 1.0
  resume_from: checkpoints/cycle1_stage1_local_precision_2026_04_19/best_model.pt
  selection_metric: debug_ar50
  anchor_loss_weight: 0.0
  anchor_temperature: 0.1
  anchor_min_anchor_gap: 1

soft_dtw:
  start_gamma: 0.05
  end_gamma: 0.01
  normalize: true
  dist_func: sqeuclidean

augmentation:
  enabled: false
  time_stretch_range: [0.8, 1.2]
  pitch_shift_range: [-2, 2]
  noise_snr_range: [20.0, 40.0]
  augment_prob: 0.0

evaluation:
  deep_decode: deepalign_transcription_fused
  deep_distance: sqeuclidean
  band_radius_frames: null
  transcription_cache_root: .cache/transcription/basic_pitch
  fusion_deep_weight: 1.0
  fusion_onset_weight: 1.0
  fusion_note_weight: 0.75
  fusion_dlnco_weight: 0.5
  fusion_chroma_weight: 0.25
  refine_window_sec: 8.0
  score_refine_radius_sec: 0.5

output:
  checkpoint_dir: checkpoints/custom_gentle_lr1e5_2026_05_02
  save_every_n_epochs: 1
