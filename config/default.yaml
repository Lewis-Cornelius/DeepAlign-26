# DeepAlign-26 baseline comparison defaults
#
# This file documents the default settings used for hand-crafted feature
# baselines and downstream analysis. The main training config lives in
# config/deepalign.yaml.

dataset:
  swd_path: null
  performances: null
  lieder: null

features:
  sr: 22050
  hop_length: 440
  feature_type: chroma
  n_chroma: 12
  bins_per_octave: 36
  decay_rate: 0.8

alignment:
  distance: cosine
  sakoe_chiba_radius: null
  mrmsdtw_memory_mb: 500
  mrmsdtw_scales: 3

evaluation:
  tolerance_50ms: 0.05
  tolerance_100ms: 0.10
  tolerance_200ms: 0.20
  baseline_method: chroma_dtw
  candidate_method: deepalign

output:
  results_csv: results/swd_evaluation.csv
  figures_dir: figures
  figure_format: png
