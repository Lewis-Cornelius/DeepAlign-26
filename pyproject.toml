[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dis-alignment"
version = "0.1.0"
description = "DeepAlign-26 dissertation toolkit for differentiable audio alignment on SWD"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Lewis" }]
keywords = ["audio", "music", "alignment", "soft-dtw", "deep-learning", "mir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

dependencies = [
    "librosa>=0.10.0",
    "mir-eval>=0.7",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=1.5.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
# synctoolbox baseline support is best maintained in a pandas<2 environment
synctoolbox = [
    "synctoolbox>=1.3.0",
    "pandas<2.0",
]

dl = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[project.scripts]
dis-benchmark = "dis_alignment.cli:main"
deepalign = "dis_alignment.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dis_alignment"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
